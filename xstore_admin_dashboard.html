<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xStore — Admin Dashboard (Design Prototype)</title>
<style>
:root{
    --primary:#2E5C6E; --primary-light:#5C8493; --primary-dark:#21454F;
    --accent:#C68A2E; --accent-light:#DBA850;
    --success:#3F7A5C; --success-bg:#DEEDE4;
    --warning:#B6811F; --warning-bg:#F5EAD3;
    --error:#B4472E; --error-bg:#F3E0D8;
    --info:#356F80; --info-bg:#DEE9EC;
    --bg:#FAF8F1; --surface:#FFFFFF; --line:#E7E2D5; --line-soft:#F1EDE3;
    --text:#1A2A24; --text-2:#5B655E; --text-3:#8C9189;
    --sidebar:#15211D; --sidebar-2:#213029; --sidebar-text:#B4C0B4;
    --radius:16px; --shadow:0 1px 3px rgba(20,33,29,.05),0 10px 26px rgba(20,33,29,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .app{display:flex;min-height:100vh}

  /* Sidebar */
  .sidebar{width:248px;background:var(--sidebar);color:var(--sidebar-text);position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;padding:18px 12px;z-index:20}
  .brand{display:flex;align-items:center;gap:10px;padding:8px 10px 18px}
  .brand .logo{width:34px;height:34px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:var(--sidebar);font-weight:800;font-size:18px}
  .brand b{color:#F3F1E8;font-size:16px;letter-spacing:.2px}
  .brand span{display:block;font-size:11px;color:var(--accent-light)}
  .nav-group{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:#7E8C7F;padding:14px 12px 6px}
  .nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--sidebar-text);font-weight:500;cursor:pointer;position:relative}
  .nav a:hover{background:var(--sidebar-2);color:#fff}
  .nav a.active{background:linear-gradient(90deg,var(--primary),var(--primary-dark));color:#fff}
  .nav a svg{width:18px;height:18px;flex:0 0 18px}
  .nav a .badge{margin-left:auto;background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px}
  .side-foot{margin-top:auto;padding:12px 10px;display:flex;align-items:center;gap:10px;border-top:1px solid #322e6e}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--primary-light);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
  .side-foot small{color:#8f8dc0;display:block}

  /* Main */
  .main{flex:1;margin-left:248px;min-width:0}
  .topbar{height:64px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 26px;position:sticky;top:0;z-index:10}
  .topbar h1{font-size:18px;font-weight:700}
  .search{margin-left:8px;flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--text-3)}
  .search input{border:none;background:none;outline:none;flex:1;font-size:13px;color:var(--text)}
  .top-actions{margin-left:auto;display:flex;align-items:center;gap:14px;color:var(--text-2)}
  .icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
  .icon-btn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;background:var(--accent);border-radius:50%;border:2px solid #fff}
  .icon-btn svg{width:18px;height:18px}
  .search svg{width:16px;height:16px;flex:0 0 16px}
  .content{padding:26px}
  .view{display:none;animation:fade .25s ease}
  .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
  .page-head h2{font-size:22px;font-weight:800}
  .page-head p{color:var(--text-2);font-size:13px;margin-top:2px}

  /* Cards & grid */
  .grid{display:grid;gap:18px}
  .g-4{grid-template-columns:repeat(4,1fr)}
  .g-3{grid-template-columns:repeat(3,1fr)}
  .g-2{grid-template-columns:2fr 1fr}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card .c-head{padding:16px 18px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between}
  .card .c-head h3{font-size:15px;font-weight:700}
  .card .c-body{padding:18px}
  .kpi{padding:18px}
  .kpi .k-top{display:flex;align-items:center;justify-content:space-between}
  .kpi .k-ico{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center}
  .kpi .k-val{font-size:27px;font-weight:800;margin-top:12px;letter-spacing:-.5px}
  .kpi .k-label{color:var(--text-2);font-size:12.5px;margin-top:2px}
  .trend{font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px}
  .up{color:var(--success);background:var(--success-bg)}
  .down{color:var(--error);background:var(--error-bg)}

  /* Tables */
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-3);font-weight:700;padding:12px 18px;border-bottom:1px solid var(--line-soft);background:#F7F4EC}
  td{padding:13px 18px;border-bottom:1px solid var(--line-soft);font-size:13.5px;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#FBF9F3}
  .u{display:flex;align-items:center;gap:10px}
  .u .ua{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:13px}
  .u b{font-weight:600}.u small{color:var(--text-3);display:block;font-size:12px}
  .money{font-variant-numeric:tabular-nums;font-weight:600}

  /* Badges */
  .badge-s{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:5px}
  .b-green{color:#2C6347;background:var(--success-bg)} .b-amber{color:#7E5A14;background:var(--warning-bg)}
  .b-red{color:#8A3A24;background:var(--error-bg)} .b-blue{color:#2A5666;background:var(--info-bg)}
  .b-grey{color:#4C554E;background:#ECE9DF} .b-indigo{color:#22505E;background:#D9E5E8}
  .dotb{width:7px;height:7px;border-radius:50%}

  /* Buttons */
  .btn{border:none;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .btn-p{background:var(--primary);color:#fff}.btn-p:hover{background:var(--primary-dark)}
  .btn-ok{background:var(--success);color:#fff}.btn-ok:hover{filter:brightness(.94)}
  .btn-no{background:#fff;color:var(--error);border:1px solid var(--error)}.btn-no:hover{background:var(--error-bg)}
  .btn-g{background:#fff;border:1px solid var(--line);color:var(--text-2)}.btn-g:hover{background:var(--bg)}
  .btn-sm{padding:6px 11px;font-size:12px}
  td.r .btn+.btn{margin-left:8px}

  /* Tabs / chips */
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .chip{padding:7px 14px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--text-2);font-size:13px;font-weight:600;cursor:pointer}
  .chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}

  /* Charts */
  .bars{display:flex;flex-direction:column;gap:12px}
  .bar-row{display:grid;grid-template-columns:120px 1fr 52px;align-items:center;gap:12px;font-size:13px}
  .bar-track{height:10px;background:var(--line-soft);border-radius:20px;overflow:hidden}
  .bar-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--primary-light),var(--primary))}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:12.5px;color:var(--text-2)}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:middle}

  /* Category cards */
  .cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .cat{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#fff}
  .cat .ci{width:44px;height:44px;border-radius:12px;background:#EAF0F1;color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:20px}
  .cat .cmeta{flex:1;min-width:0}.cat .cmeta b{font-size:14.5px}.cat .cmeta small{color:var(--text-3);display:block}
  .cat .ci-img{width:44px;height:44px;border-radius:12px;object-fit:cover;flex:0 0 44px;background:#EAF0F1}
  .cat-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .switch{width:40px;height:22px;border-radius:20px;background:var(--success);position:relative;cursor:pointer;flex:0 0 40px}
  .switch.off{background:var(--line)}
  .switch::after{content:'';position:absolute;top:2px;left:20px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .switch.off::after{left:2px}

  /* Moderation cards */
  .mod{display:flex;gap:14px;padding:16px;border:1px solid var(--line);border-radius:12px;background:#fff;align-items:center}
  .mod .thumb{width:66px;height:66px;border-radius:10px;background:linear-gradient(135deg,#EAF0F1,#DAE6E9);display:flex;align-items:center;justify-content:center;font-size:26px;flex:0 0 66px}
  .mod .minfo{flex:1;min-width:0}
  .mod .minfo b{font-size:15px}.mod .minfo p{color:var(--text-2);font-size:12.5px;margin-top:2px}
  .mod .mactions{display:flex;gap:8px}

  .split{display:grid;grid-template-columns:2fr 1fr;gap:18px}
  .list-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
  .list-row:last-child{border-bottom:none}
  .toast{position:fixed;bottom:24px;right:24px;background:#111827;color:#fff;padding:12px 18px;border-radius:11px;font-size:13.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transform:translateY(12px);transition:.28s;z-index:99}
  .toast.show{opacity:1;transform:none}
  .muted{color:var(--text-2)} .r{text-align:right} .mt{margin-top:18px}
  .donut-wrap{display:flex;align-items:center;gap:22px}
  .banner{border:1px dashed var(--line);border-radius:12px;padding:16px;display:flex;gap:14px;align-items:center}
  .banner .bimg{width:120px;height:64px;border-radius:9px;background:linear-gradient(120deg,var(--primary),var(--accent));flex:0 0 120px}
  .form-row{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .form-row label{font-size:12.5px;font-weight:600;color:var(--text-2)}
  .form-row input,.form-row select{padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;font-family:inherit}

  /* Drawer / detail panel */
  .overlay{position:fixed;inset:0;background:rgba(17,24,39,.42);opacity:0;pointer-events:none;transition:.25s;z-index:40}
  .overlay.show{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:430px;max-width:92vw;background:#fff;box-shadow:-12px 0 44px rgba(17,24,39,.18);transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:50;display:flex;flex-direction:column}
  .drawer.show{transform:none}
  .d-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .d-close{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-2);font-size:15px}
  .d-close:hover{background:var(--bg)}
  .d-body{padding:20px 22px;overflow:auto;flex:1}
  .kv{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px}
  .kv span{color:var(--text-2)} .kv b{text-align:right}

  /* Delivery requests (consumer package pilot) */
  .pkg-in{width:74px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit}
  .hint{display:block;font-size:11.5px;color:var(--text-3);margin-top:4px;font-weight:400}
  .route b{font-weight:600}
  .route small{color:var(--text-3);display:block;font-size:12px}

  /* ---------- async states (live data: loading / empty / error) ---------- */
  .state{padding:46px 24px;text-align:center;color:var(--text-2);display:flex;flex-direction:column;align-items:center;gap:6px}
  .state svg{width:34px;height:34px;opacity:.45}
  .state b{color:var(--text);font-size:15px}
  .state span{font-size:13px;max-width:340px}
  .spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .search-mini{flex:1;max-width:340px;margin-left:0}
  .pager{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 18px;border-top:1px solid var(--line-soft);font-size:12.5px;color:var(--text-2);flex-wrap:wrap}
  .pager .pg-btns{display:flex;gap:8px;align-items:center}
  .btn[disabled]{opacity:.45;cursor:not-allowed}

  /* ---------- login gate ---------- */
  .gate{position:fixed;inset:0;background:linear-gradient(135deg,var(--sidebar),var(--primary-dark));display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
  .gate-card{background:#fff;border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.35);padding:32px;width:100%;max-width:380px}
  .gate-card .logo{width:46px;height:46px;border-radius:12px;background:var(--accent);color:var(--sidebar);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;margin-bottom:16px}
  .gate-card h2{font-size:20px;font-weight:800}
  .gate-card p{color:var(--text-2);font-size:13px;margin:4px 0 18px}
  .gate-err{color:var(--error);font-size:12.5px;font-weight:600;min-height:18px;margin-bottom:8px}

  /* ---------- responsive (keep last: these must override the base rules above) ---------- */
  .menu-btn{display:none}
  @media(max-width:1050px){
    .g-4{grid-template-columns:repeat(2,1fr)}
    .g-2,.split{grid-template-columns:1fr}
    .cat-grid{grid-template-columns:1fr}
    .sidebar{transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);box-shadow:12px 0 44px rgba(17,24,39,.18);z-index:45}
    .sidebar.open{transform:none}
    .main{margin-left:0}
    .menu-btn{display:flex}
  }
  @media(max-width:820px){
    .content{padding:18px}
    .topbar{padding:0 16px}
    .card{overflow-x:auto}
    .card>table{min-width:640px}
    .card th{white-space:nowrap;padding:10px 14px}
    .card td{white-space:nowrap;padding:11px 14px}
  }
  @media(max-width:640px){
    .g-4,.g-3{grid-template-columns:1fr}
    .content{padding:14px}
    .topbar{gap:10px;padding:0 12px}
    .topbar h1{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .search{min-width:0;margin-left:0}
    .search input{min-width:0}
    .top-actions{gap:8px}
    .hide-sm{display:none}
    .kpi .k-val{font-size:23px}
    .page-head h2{font-size:19px}
    .mod{flex-wrap:wrap}
    .mod .mactions{width:100%;justify-content:flex-end}
    .bar-row{grid-template-columns:86px 1fr 46px;gap:8px}
    .banner{flex-wrap:wrap}
    .banner .bimg{flex:0 0 96px;width:96px;height:52px}
    .toast{left:16px;right:16px;bottom:16px;text-align:center}
    .drawer{width:100vw;max-width:100vw}
  }

</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand"><div class="logo">x</div><div><b>xStore</b><span>Admin Console</span></div></div>
    <div class="nav" id="nav">
      <div class="nav-group">Overview</div>
      <a data-view="overview" class="active"><i data-ic="grid"></i><span>Dashboard</span></a>
      <!-- PHASE 2 — <a data-view="analytics"><i data-ic="chart"></i><span>Analytics</span></a> -->
      <div class="nav-group">Marketplace</div>
      <a data-view="moderation"><i data-ic="shield"></i><span>Product Moderation</span><span class="badge">5</span></a>
      <a data-view="vendors"><i data-ic="store"></i><span>Vendors</span><span class="badge">3</span></a>
      <a data-view="categories"><i data-ic="tag"></i><span>Categories</span></a>
      <a data-view="orders"><i data-ic="box"></i><span>Orders</span></a>
      <a data-view="couriers"><i data-ic="truck"></i><span>Delivery</span><span class="badge">1</span></a>
      <a data-view="packages"><i data-ic="send"></i><span>Delivery Requests</span><span class="badge">1</span></a>
      <!-- PHASE 2 — <a data-view="disputes"><i data-ic="alert"></i><span>Disputes</span><span class="badge">6</span></a> -->
      <div class="nav-group">Growth</div>
      <a data-view="customers"><i data-ic="users"></i><span>Users</span></a>
      <!-- PHASE 2 — <a data-view="coupons"><i data-ic="ticket"></i><span>Coupons</span></a> -->
      <a data-view="content"><i data-ic="image"></i><span>Content &amp; Banners</span></a>
      <div class="nav-group">System</div>
      <a data-view="settings"><i data-ic="cog"></i><span>Settings</span></a>
    </div>
    <div class="side-foot" style="cursor:pointer" title="Sign out" onclick="if(confirm('Sign out?'))logout()"><div class="avatar">A</div><div><b style="color:#fff;font-size:13px">Ahmed (Owner)</b><small>Super Admin · sign out</small></div></div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="icon-btn menu-btn" onclick="toggleSidebar()"><i data-ic="menu"></i></div>
      <h1 id="topTitle">Dashboard</h1>
      <div class="search"><i data-ic="search"></i><input id="searchInput" placeholder="Search this page…"></div>
      <div class="top-actions">
        <div class="icon-btn"><i data-ic="bell"></i><span class="dot"></span></div>
        <div class="icon-btn hide-sm"><i data-ic="help"></i></div>
        <div class="avatar" style="background:var(--primary)">A</div>
      </div>
    </div>
    <div class="content" id="content"><!-- views injected --></div>
  </div>
</div>
<div class="overlay" id="overlay" onclick="closeDrawer();closeSidebar()"></div>
<aside class="drawer" id="drawer"></aside>
<div class="toast" id="toast"></div>

<script>
/* ---------- tiny icon set ---------- */

 search:'M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3',

function productDrawer(i){
 const p=(modState.items||[])[i]; if(!p)return; const m=mapListing(p);
 const cmp=m.compareAt?` <span style="text-decoration:line-through;color:var(--text-3);font-size:15px;font-weight:500">${EGP(m.compareAt)}</span>`:'';
 openDrawer('Review product',
   (m.image?`<div style="width:100%;height:160px;border-radius:11px;overflow:hidden;margin-bottom:16px"><img src="${esc(m.image)}" style="width:100%;height:100%;object-fit:cover"></div>`:'')
   +`<h3 style="font-size:17px;margin-bottom:6px">${esc(m.title)}</h3>`

/* ---------- delivery (courier pilot) ---------- */
function couriers(){
 const held=COURIERS.reduce((s,c)=>s+c.cash,0);
 const today=COURIERS.reduce((s,c)=>s+c.today,0);
 const del30=COURIERS.reduce((s,c)=>s+c.delivered30,0);
 const fail30=COURIERS.reduce((s,c)=>s+c.failed30,0);
 const failRate=del30+fail30?Math.round(fail30/(del30+fail30)*100):0;
 const rows=COURIERS.map((c,i)=>{
   const due=cashDue(c);
   const st=c.status==='active'?['b-green','Active']:['b-grey','Off duty'];
   const cashCell=due
     ?`<span class="money" style="color:#B4472E">${EGP(c.cash)}</span> <span class="badge-s b-red">Cap reached</span>`
     :`<span class="money">${EGP(c.cash)}</span>`;
   return `<tr data-status="${c.status}"><td><div class="u" style="cursor:pointer" onclick="courierDrawer(${i})">${avatar(c.n,'50')}<div><b>${c.n}</b><small>${c.phone}</small></div></div></td>
     <td class="muted">${c.zone}</td>
     <td><span class="badge-s ${st[0]}"><span class="dotb" style="background:currentColor"></span>${st[1]}</span></td>
     <td>${c.today}</td><td>${c.delivered30} <small class="muted">/ ${c.failed30} failed</small></td>
     <td>${cashCell}</td>
     <td class="r"><button class="btn btn-g btn-sm" onclick="courierDrawer(${i})">Details</button>${c.cash>0?`<button class="btn btn-ok btn-sm" onclick="courierDrawer(${i})">Collect cash</button>`:''}</td></tr>`}).join('');
 const info=`<div class="card mt"><div class="c-body" style="font-size:12.5px;line-height:1.7;color:var(--text-2)">
   <b style="color:var(--text)">How "Delivered by xStore" works</b>
   <p style="margin-top:6px">Couriers are <b>owner-created accounts</b> (role: courier — no self-registration). They pick parcels up from the vendor, collect COD at the door, and the cash stays in their <b>cash-in-hand wallet</b> until deposited with xStore. Vendors on courier-delivered orders are paid net of commission — no owed-balance chasing.</p>
   <p style="margin-top:8px">Each courier has a cash cap (<b>${EGP(5000)}</b>). At/above the cap they must deposit before taking new COD orders — record it here with <b>Collect cash</b>.</p>
   <p style="margin-top:8px">Backend: <code>POST /admin/couriers</code> (create account) · <code>POST /orders/{id}/assign-courier</code> · <code>GET /orders/courier/{id}</code> (app run list) · <code>POST /admin/couriers/{id}/cash-handover</code>. Cap maps to <code>kCourierCashHandoverThresholdEgp</code>.</p></div></div>`;
 return `<div class="page-head"><div><h2>Delivery — Couriers</h2><p>Platform couriers collecting COD ("Delivered by xStore" pilot) · assign orders from the <a data-jump="orders" style="color:var(--primary);cursor:pointer">Orders</a> page</p></div>
   <div style="display:flex;gap:10px;align-items:center"><div class="tabs" style="margin:0"><span class="chip active">All</span><span class="chip">Active</span><span class="chip">Off duty</span></div>
   <button class="btn btn-p" onclick="openCourierForm()">+ Add courier</button></div></div>
   ${deliveryConnectBar()}
   <div class="grid g-4" style="margin-bottom:18px;margin-top:18px">
     ${kpi('truck',String(COURIERS.filter(c=>c.status==='active').length),'Active couriers','','up','#2E5C6E')}
     ${kpi('cash',EGP(held),'COD cash with couriers',COURIERS.filter(cashDue).length?'collect':'ok',COURIERS.filter(cashDue).length?'down':'up','#C68A2E')}
     ${kpi('box',String(today),'Tasks today','','up','#3F7A5C')}
     ${kpi('alert',failRate+'%','Failed deliveries (30d)','watch','down','#B4472E')}</div>
   <div class="card"><table><thead><tr><th>Courier</th><th>Zone</th><th>Status</th><th>Today</th><th>Delivered (30d)</th><th>Cash in hand</th><th class="r">Action</th></tr></thead><tbody>${rows}</tbody></table></div>${info}`;
}
function courierDrawer(i){
 const c=COURIERS[i],due=cashDue(c);
 const st=c.status==='active'?['b-green','Active']:['b-grey','Off duty'];
 const cashBlock=c.cash>0
   ?`<div class="form-row" style="margin-top:10px"><label>Cash received from courier (EGP)</label><input id="hoAmt" inputmode="numeric" value="${c.cash}"></div>
     <div style="display:flex;gap:8px"><button class="btn btn-ok" style="flex:1;justify-content:center" onclick="recordHandover(${i})">Record handover</button></div>`
   :'<div style="padding:12px 14px;background:var(--success-bg);color:#2C6347;border-radius:11px;font-size:13px;font-weight:600;margin-top:10px">✓ No cash with this courier.</div>';
 openDrawer('Courier — '+c.n,
   '<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">'+avatar(c.n,'50')+'<div><b style="font-size:16px">'+c.n+'</b><div class="muted" style="font-size:12.5px">Platform courier · role: courier</div></div></div>'
   +'<div style="margin-bottom:8px;display:flex;gap:6px;flex-wrap:wrap"><span class="badge-s b-indigo">🚚 Courier</span><span class="badge-s '+st[0]+'">'+st[1]+'</span>'+(due?'<span class="badge-s b-red">Cash cap reached</span>':'')+'</div>'
   +secH('Profile')
   +kv('Phone',c.phone)+kv('Zone',c.zone)+kv('Joined',c.joined)+kv('Tasks today',c.today)+kv('Delivered (30d)',c.delivered30)+kv('Failed (30d)',c.failed30)
   +secH('Cash in hand')
   +kv('Holding now','<span style="color:'+(due?'#B4472E':'inherit')+'">'+EGP(c.cash)+'</span>')+kv('Handover cap',EGP(c.cap))
   +(due?'<div style="margin-top:10px;padding:10px 12px;background:var(--error-bg);color:#8A3A24;border-radius:9px;font-size:12.5px"><b>Cap reached</b> — no new COD orders until the cash is deposited.</div>':'')
   +cashBlock,
   '<button class="btn btn-g" style="flex:1;justify-content:center" onclick="courierDuty('+i+')">'+(c.status==='active'?'Set off duty':'Set on duty')+'</button><button class="btn btn-g" style="flex:1;justify-content:center" onclick="closeDrawer()">Close</button>');
}
function recordHandover(i){
 const c=COURIERS[i];
 const amt=parseFloat(document.getElementById('hoAmt').value);
 if(isNaN(amt)||amt<=0){toast('Enter a valid amount');document.getElementById('hoAmt').focus();return;}
 if(DELIVERY.connected)return dlvRecordHandover(i);
 c.cash=Math.max(0,Math.round((c.cash-amt)*100)/100);
 toast(c.cash===0?'Handover recorded — courier settled ✓':'Handover recorded — '+EGP(c.cash)+' still with courier');
 closeDrawer();go('couriers');refreshCourierBadge();
}
function courierDuty(i){
 if(DELIVERY.connected)return dlvCourierDuty(i);
 const c=COURIERS[i];c.status=c.status==='active'?'off':'active';
 toast(c.n+(c.status==='active'?' is on duty ✓':' set off duty'));
 closeDrawer();go('couriers');
}
function refreshCourierBadge(){

 if(b){if(n>0)b.textContent=n;else b.remove();}

 'Create courier',v=>{if(DELIVERY.connected)return dlvCreateCourier(v[0],v[1],v[2]);COURIERS.push({n:v[0],phone:v[1],zone:v[2],status:'active',cash:0,cap:5000,today:0,delivered30:0,failed30:0,joined:'Jul 2026'});toast('Courier "'+v[0]+'" created ✓ — share the login with them');closeDrawer();go('couriers');});}
/* ---------- delivery requests (consumer package pilot) ---------- */
function pkgActions(p,i){
 const sug=pkgSuggest(p);
 const priceHint=`<small class="hint">Suggested ${EGP(sug)} — 60 base${pkgCross(p)?' + 20 cross-city':''}</small>`;
 if(p.status==='submitted'||(p.status==='priced'&&PKG_EDIT===i))
   return `<div style="display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap">
     <input class="pkg-in" id="pkgPr-${i}" inputmode="numeric" value="${p.price!=null?p.price:sug}">
     <button class="btn btn-p btn-sm" onclick="setPkgPrice(${i})">${p.status==='submitted'?'Set price':'Save'}</button>
     ${p.status==='submitted'
       ?`<button class="btn btn-no btn-sm" onclick="cancelPkg(${i})" title="Cancel request">✕</button>`
       :`<button class="btn btn-g btn-sm" onclick="PKG_EDIT=-1;go('packages')">Back</button>`}</div>${priceHint}`;
 if(p.status==='priced')
   return `<button class="btn btn-g btn-sm" onclick="pkgEditPrice(${i})">Edit price</button><button class="btn btn-no btn-sm" onclick="cancelPkg(${i})">✕ Cancel</button><small class="hint">Waiting for the customer to confirm ${EGP(p.price)}</small>`;
 if(p.status==='confirmed')
   return (p.courier
     ?`<span class="badge-s b-indigo" title="Assigned courier">🚚 ${p.courier.split(' ')[0]}</span> <button class="btn btn-g btn-sm" onclick="assignPkgCourierDrawer(${i})">Reassign</button>`
     :`<button class="btn btn-p btn-sm" onclick="assignPkgCourierDrawer(${i})">Assign courier</button>`)
     +`<small class="hint">Courier collects ${EGP(p.price)} in cash at pickup</small>`;
 if(p.status==='pickedup'||p.status==='delivered')
   return `<span class="badge-s b-indigo" title="Assigned courier">🚚 ${p.courier.split(' ')[0]}</span> <button class="btn btn-g btn-sm" onclick="pkgDrawer(${i})">View</button><small class="hint">💵 Cash collected at pickup: ${EGP(p.price)}</small>`;
 return `<button class="btn btn-g btn-sm" onclick="pkgDrawer(${i})">View</button>`;
}
function packages(){
 const need=PKGS.filter(p=>p.status==='submitted').length;
 const wait=PKGS.filter(p=>p.status==='priced').length;
 const transit=PKGS.filter(p=>p.status==='confirmed'||p.status==='pickedup').length;
 const done=PKGS.filter(p=>p.status==='delivered').length;
 const rows=PKGS.map((p,i)=>`<tr data-status="${p.status}">
   <td><b style="cursor:pointer" onclick="pkgDrawer(${i})">${p.id}</b></td>
   <td><div class="u" style="cursor:pointer" onclick="pkgDrawer(${i})">${avatar(p.customer,'50')}<div><b>${p.customer} ${(p.requesterRole==='vendor')?'<span class="badge-s b-indigo" style="padding:1px 7px">Vendor</span>':'<span class="badge-s b-blue" style="padding:1px 7px">Customer</span>'}</b><small>${p.phone}</small></div></div></td>
   <td class="route"><b>${p.pickup.city} → ${p.drop.city}${pkgCross(p)?' <span class="badge-s b-amber" style="padding:1px 7px">cross-city</span>':''}</b><small>${p.pickup.street} → ${p.drop.street} (${p.drop.name})</small></td>
   <td class="muted" style="max-width:200px;white-space:normal">${p.note}</td>
   <td class="muted">${p.submitted}</td>
   <td class="money">${p.price!=null?EGP(p.price):'—'}</td>
   <td><span class="badge-s ${PSTAT[p.status][0]}">${PSTAT[p.status][1]}</span></td>
   <td class="r">${pkgActions(p,i)}</td></tr>`).join('');
 const info=`<div class="card mt"><div class="c-body" style="font-size:12.5px;line-height:1.7;color:var(--text-2)">
   <b style="color:var(--text)">How package delivery requests work</b>
   <p style="margin-top:6px">A customer submits a pickup + destination. <b>You set the price</b> (reference: <b>EGP 60</b> base + <b>EGP 20</b> cross-city surcharge). The customer confirms and pays the courier <b>in cash at pickup</b>, then your assigned courier delivers the package. Lifecycle: <b>submitted → priced → confirmed → picked up → delivered</b>; cancelling is possible while submitted / priced.</p>
   <p style="margin-top:8px">Pickup cash goes into the courier's <b>cash-in-hand wallet</b> — the same ledger as COD, counting toward the ${EGP(5000)} cap. Collect it from <a data-jump="couriers" style="color:var(--primary);cursor:pointer">Delivery</a> → Collect cash.</p>
   <p style="margin-top:8px">Backend: <code>POST /delivery-requests</code> · <code>PUT /admin/delivery-requests/{id}/price</code> · <code>POST /delivery-requests/{id}/confirm</code> · <code>POST /admin/delivery-requests/{id}/assign-courier</code> · <code>POST /delivery-requests/{id}/pickup</code> / <code>…/deliver</code> · <code>POST /delivery-requests/{id}/cancel</code>.</p></div></div>`;
 return `<div class="page-head"><div><h2>Delivery Requests</h2><p>Consumer package delivery ("send a package" pilot) · you set the price, the customer pays the courier <b>in cash at pickup</b></p></div>
   <div class="tabs"><span class="chip active">All</span><span class="chip">Submitted</span><span class="chip">Priced</span><span class="chip">Confirmed</span><span class="chip">Picked up</span><span class="chip">Delivered</span><span class="chip">Cancelled</span></div></div>
   ${deliveryConnectBar()}
   <div class="grid g-4" style="margin-bottom:18px;margin-top:18px">
     ${kpi('alert',String(need),'Awaiting your price',need?'price now':'clear',need?'down':'up','#C68A2E')}
     ${kpi('users',String(wait),'Awaiting customer confirmation','','up','#356F80')}
     ${kpi('truck',String(transit),'In transit (confirmed + picked up)','','up','#2E5C6E')}
     ${kpi('box',String(done),'Delivered (30d)','','up','#3F7A5C')}</div>
   <div class="card"><table><thead><tr><th>Request</th><th>Customer</th><th>Route</th><th>Package</th><th>Submitted</th><th>Price</th><th>Status</th><th class="r">Action</th></tr></thead><tbody>${rows}</tbody></table></div>${info}`;
}
function setPkgPrice(i){
 const p=PKGS[i];
 const amt=parseFloat(document.getElementById('pkgPr-'+i).value);
 if(isNaN(amt)||amt<=0){toast('Enter a valid price');document.getElementById('pkgPr-'+i).focus();return;}
 if(DELIVERY.connected)return dlvSetPrice(i,amt);
 const first=p.status==='submitted';
 p.price=Math.round(amt*100)/100;p.status='priced';PKG_EDIT=-1;
 toast(first?p.id+' priced at '+EGP(p.price)+' — customer asked to confirm ✓':'Price updated to '+EGP(p.price)+' — customer notified ✓');
 go('packages');refreshPkgBadge();
}
function pkgEditPrice(i){PKG_EDIT=i;go('packages');}
function cancelPkg(i){
 const p=PKGS[i];
 if(p.status!=='submitted'&&p.status!=='priced'){toast('Only submitted / priced requests can be cancelled');return;}
 if(DELIVERY.connected){toast('Cancellation is customer-side in the live API');return;}
 p.status='cancelled';PKG_EDIT=-1;
 toast(p.id+' cancelled — customer notified');
 go('packages');refreshPkgBadge();
}
function refreshPkgBadge(){
 const n=PKGS.filter(p=>p.status==='submitted').length;
 const b=document.querySelector('#nav a[data-view=packages] .badge');
 if(b){if(n>0)b.textContent=n;else b.remove();}
}
function assignPkgCourierDrawer(i){
 const p=PKGS[i];
 const rows=COURIERS.map((c,ci)=>{
   const off=c.status!=='active',due=cashDue(c);
   const right=off?'<span class="badge-s b-grey">Off duty</span>'
     :due?'<span class="badge-s b-red">Cash cap</span>'
     :`<button class="btn btn-p btn-sm" onclick="assignPkgCourier(${i},${ci})">Assign</button>`;
   return `<div class="list-row">${avatar(c.n,'50')}<div style="flex:1"><b>${c.n}</b><small class="muted">${c.zone} · ${c.today} tasks today · holding ${EGP(c.cash)}</small></div>${right}</div>`;}).join('');
 openDrawer('Assign courier — '+p.id,
   '<p class="muted" style="font-size:12.5px;margin-bottom:10px">Pickup <b>'+p.pickup.street+', '+p.pickup.city+'</b> → '+p.drop.street+', '+p.drop.city+'. The courier collects <b>'+EGP(p.price)+'</b> in cash from '+p.customer+' at pickup — it stays in their cash-in-hand wallet until deposited. Couriers off duty or at their cash cap can\'t take the job.</p>'+rows);
}
function assignPkgCourier(i,ci){
 if(DELIVERY.connected)return dlvAssignPkgCourier(i,ci);
 PKGS[i].courier=COURIERS[ci].n;COURIERS[ci].today++;
 toast(PKGS[i].id+' assigned to '+COURIERS[ci].n+' ✓');
 closeDrawer();go('packages');
}
function pkgDrawer(i){
 const p=PKGS[i];
 const steps=['Submitted','Priced','Confirmed','Picked up','Delivered'];
 const cur=steps.indexOf(PSTAT[p.status][1]);
 const tl=p.status==='cancelled'
   ?'<div class="list-row"><span class="dotb" style="width:11px;height:11px;background:var(--error)"></span><span style="color:var(--error)">Cancelled'+(p.price!=null?' (was priced at '+EGP(p.price)+')':'')+'</span></div>'
   :steps.map((s,x)=>'<div class="list-row"><span class="dotb" style="width:11px;height:11px;background:'+(x<=cur?'var(--success)':'var(--line)')+'"></span><span style="'+(x<=cur?'':'color:var(--text-3)')+'">'+s+(s==='Picked up'&&x<=cur?' — '+EGP(p.price)+' cash collected':'')+'</span></div>').join('');

/* ---------- toast + moderation ---------- */
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
async function decide(i,action){
 const p=(modState.items||[])[i]; if(!p)return; const m=mapListing(p);
 if(!m.id){toast('Missing listing id');return;}
 let reason;
 if(action==='reject'){
   reason=prompt('Reason for rejecting “'+m.title+'”? (shown to the vendor)','');
   if(reason===null)return;                     // cancelled
 }
 try{
   if(action==='approve') await apiFetch('/api/admin/listings/'+encodeURIComponent(m.id)+'/approve',{method:'PUT',body:{}});
   else await apiFetch('/api/admin/listings/'+encodeURIComponent(m.id)+'/reject',{method:'PUT',body:{rejectionReason:reason}});
   toast(action==='approve'?'Product approved — now live ✓':'Product rejected — vendor notified');
   closeDrawer(); loadModeration();
 }catch(e){ if(e.status===401)return; toast((action==='approve'?'Approve':'Reject')+' failed: '+(e.message||'error')); }
}
async function toggleHotDeal(i){
 const p=(modState.items||[])[i]; if(!p)return; const m=mapListing(p);
 if(!m.id){toast('Missing listing id');return;}
 try{
   await apiFetch('/api/admin/listings/'+encodeURIComponent(m.id)+'/hot-deal',{method:'PUT'});
   p.isHotDeal=!m.isHot; renderModeration();
   toast(m.isHot?'Removed hot-deal tag':'Marked as hot deal 🔥');
 }catch(e){ if(e.status===401)return; toast('Hot-deal toggle failed: '+(e.message||'error')); }
}

function resetWallet(i){
 const c=vcomm(i);
 if(c.outstanding===0){toast('Wallet already settled');return;}
 c.outstanding=0;
 toast('Payment recorded — wallet reset to EGP 0 ✓');
 openVendorProducts(i,'commission');
}
function recordPayment(i){
 const c=vcomm(i);
 const amt=parseFloat(document.getElementById('payAmt').value);
 if(isNaN(amt)||amt<=0){toast('Enter a valid amount');document.getElementById('payAmt').focus();return;}
 c.outstanding=Math.max(0,Math.round((c.outstanding-amt)*100)/100);
 toast(c.outstanding===0?'Payment recorded — wallet settled ✓':'Payment recorded — '+EGP(c.outstanding)+' still owed');
 openVendorProducts(i,'commission');
}
function saveCommThresholds(i){
 const warn=parseFloat(document.getElementById('warnTh').value);
 const pause=parseFloat(document.getElementById('pauseTh').value);
 if(isNaN(warn)||warn<0){toast('Enter a valid warn threshold');document.getElementById('warnTh').focus();return;}
 if(isNaN(pause)||pause<0){toast('Enter a valid pause threshold');document.getElementById('pauseTh').focus();return;}
 if(pause<warn){toast('Pause threshold must be ≥ warn threshold');document.getElementById('pauseTh').focus();return;}
 const c=vcomm(i); c.warn=warn; c.pause=pause;
 toast('Commission thresholds saved ✓');
 openVendorProducts(i,'commission');
}

function formDrawer(title,fields,submitLabel,onSubmit,values){
 const esc=s=>String(s).replace(/"/g,'&quot;');
 const body=fields.map((f,i)=>{const val=values&&values[i]!=null?values[i]:'';
   return f.type==='select'
   ?'<div class="form-row"><label>'+f.label+'</label><select id="ff'+i+'">'+f.options.map(o=>'<option'+(o===val?' selected':'')+'>'+o+'</option>').join('')+'</select></div>'
   :'<div class="form-row"><label>'+f.label+(f.required?' *':'')+'</label><input id="ff'+i+'" value="'+esc(val)+'" placeholder="'+(f.ph||'')+'"></div>';}).join('');
 window._submitForm=function(){
   const vals=fields.map((f,i)=>document.getElementById('ff'+i).value.trim());
   for(let i=0;i<fields.length;i++){if(fields[i].required&&!vals[i]){toast('Please fill in: '+fields[i].label);document.getElementById('ff'+i).focus();return;}}
   onSubmit(vals);
 };
 openDrawer(title,body,'<button class="btn btn-g" style="flex:1;justify-content:center" onclick="closeDrawer()">Cancel</button><button class="btn btn-p" style="flex:1;justify-content:center" onclick="_submitForm()">'+submitLabel+'</button>');

/* ============================================================
   Categories (live) — Postman "Categories" folder
     GET    /api/categories
     POST   /api/categories            (multipart: nameEn,nameAr,isActive,image)
     PUT    /api/categories            (multipart: id,nameEn,nameAr,isActive,image)
     PUT    /api/categories/{id}/status  (json: {isActive})
     DELETE /api/categories/{id}
   ============================================================ */
const catState={items:null};
async function loadCategories(){
 const host=document.getElementById('catHost'); if(!host)return;
 host.innerHTML=stateLoading('Loading categories…');
 try{
   const data=await apiFetch('/api/categories');
   catState.items=Array.isArray(data)?data:readPage(data,200).items;
   renderCategories();
 }catch(e){ if(e.status===401)return; host.innerHTML=stateError(e.message,'loadCategories()'); }
}
function mapCategory(c){
 let img=_fne(c.imageUrl,c.image,c.imagePath,c.iconUrl);
 if(img&&!/^https?:\/\//i.test(String(img))) img=API.base.replace(/\/+$/,'')+'/'+String(img).replace(/^\/+/,'');
 return{
   id:_fne(c.id,c.categoryId,c._id),
   nameEn:_fne(c.nameEn,c.name,c.nameAr)||'Untitled',
   nameAr:_fne(c.nameAr,c.nameEn)||'',
   image:img,
   active:c.isActive===undefined||c.isActive===null?true:!!c.isActive,
   products:_numOr(c.productsCount,c.listingsCount,c.liveProducts,c.products),
   subs:_numOr(c.subcategoriesCount,c.subCategoriesCount,c.subcategories)
 };
}
function renderCategories(){
 const host=document.getElementById('catHost'); if(!host)return;
 const items=catState.items||[];
 if(!items.length){host.innerHTML='<div class="card"><div class="c-body">'+stateEmpty('No categories yet — add your first one.')+'</div></div>';return;}
 const cards=items.map((c,i)=>{const m=mapCategory(c);
   const thumb=m.image
     ?'<img class="ci-img" src="'+esc(m.image)+'" alt="" onerror="this.replaceWith(Object.assign(document.createElement(\'div\'),{className:\'ci\',textContent:\'📦\'}))">'
     :'<div class="ci">'+esc((m.nameEn[0]||'📦').toUpperCase())+'</div>';
   const meta=[m.products!=null?m.products+' products':null,m.subs!=null?m.subs+' subcategories':null].filter(Boolean).join(' · ')||'—';
   return '<div class="cat">'+thumb
     +'<div class="cmeta"><b>'+esc(m.nameEn)+'</b><small>'+(m.nameAr?'<bdi>'+esc(m.nameAr)+'</bdi> · ':'')+meta+'</small></div>'
     +'<div class="cat-actions">'
     +'<div class="switch '+(m.active?'':'off')+'" title="Show / hide" onclick="toggleCategory('+i+')"></div>'
     +'<button class="btn btn-g btn-sm" onclick="openCategoryForm('+i+')">Edit</button>'
     +'<button class="btn btn-no btn-sm" onclick="deleteCategory('+i+')">Delete</button>'
     +'</div></div>';
 }).join('');
 host.innerHTML='<div class="card"><div class="c-body"><div class="cat-grid">'+cards+'</div></div></div>';
}
async function toggleCategory(i){
 const c=(catState.items||[])[i]; if(!c)return; const m=mapCategory(c);
 if(!m.id){toast('Missing category id');return;}
 const next=!m.active;
 try{
   await apiFetch('/api/categories/'+encodeURIComponent(m.id)+'/status',{method:'PUT',body:{isActive:next}});
   c.isActive=next; renderCategories();
   toast('“'+m.nameEn+'” '+(next?'visible':'hidden'));
 }catch(e){ if(e.status===401)return; toast('Status update failed: '+(e.message||'error')); renderCategories(); }
}
async function deleteCategory(i){
 const c=(catState.items||[])[i]; if(!c)return; const m=mapCategory(c);
 if(!m.id){toast('Missing category id');return;}
 if(!confirm('Delete category “'+m.nameEn+'”? This cannot be undone.'))return;
 try{
   await apiFetch('/api/categories/'+encodeURIComponent(m.id),{method:'DELETE'});
   toast('Category “'+m.nameEn+'” deleted'); loadCategories();
 }catch(e){ if(e.status===401)return; toast('Delete failed: '+(e.message||'error')); }
}
function openCategoryForm(i){
 const editing=(i!==undefined&&i!==null);
 const m=editing?mapCategory(catState.items[i]):{nameEn:'',nameAr:'',active:true};
 openDrawer(editing?'Edit category':'Add category',
   '<div class="form-row"><label>Name (English) *</label><input id="catEn" value="'+esc(m.nameEn)+'" placeholder="Electronics"></div>'
   +'<div class="form-row"><label>Name (Arabic) *</label><input id="catAr" dir="rtl" value="'+esc(m.nameAr)+'" placeholder="إلكترونيات"></div>'
   +'<div class="form-row"><label>Image '+(editing?'<span class="muted" style="font-weight:400">(leave empty to keep current)</span>':'<span class="muted" style="font-weight:400">(jpg, png, webp)</span>')+'</label><input id="catImg" type="file" accept="image/jpeg,image/png,image/webp"></div>'
   +'<label style="display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer;margin-top:4px"><input id="catActive" type="checkbox" '+(m.active?'checked':'')+'> Active (visible to shoppers)</label>',
   '<button class="btn btn-g" style="flex:1;justify-content:center" onclick="closeDrawer()">Cancel</button><button class="btn btn-p" style="flex:1;justify-content:center" id="catSaveBtn" onclick="saveCategory('+(editing?i:'null')+')">'+(editing?'Save changes':'Add category')+'</button>');
}
async function saveCategory(i){
 const editing=(i!==null&&i!==undefined);
 const en=document.getElementById('catEn').value.trim();
 const ar=document.getElementById('catAr').value.trim();
 const active=document.getElementById('catActive').checked;
 const fileEl=document.getElementById('catImg'); const file=fileEl&&fileEl.files&&fileEl.files[0];
 if(!en||!ar){toast('Enter both English and Arabic names');return;}
 if(!editing&&!file){toast('Pick a category image');return;}   // image is required on create
 const btn=document.getElementById('catSaveBtn'); if(btn){btn.disabled=true;btn.textContent='Saving…';}
 const fd=new FormData();
 fd.append('nameEn',en); fd.append('nameAr',ar); fd.append('isActive',active?'true':'false');
 if(file) fd.append('image',file);
 try{
   if(editing){ fd.append('id',mapCategory(catState.items[i]).id); await apiFetch('/api/categories',{method:'PUT',body:fd}); }
   else { await apiFetch('/api/categories',{method:'POST',body:fd}); }
   toast(editing?'Category updated ✓':'Category “'+en+'” added ✓');
   closeDrawer(); loadCategories();
 }catch(e){ if(e.status===401)return; toast((editing?'Update':'Create')+' failed: '+(e.message||'error')); if(btn){btn.disabled=false;btn.textContent=editing?'Save changes':'Add category';} }
}
/* ============================================================
   Product Moderation (live) — Postman "Admin Listings" folder
     GET /api/admin/listings?status&page&pageSize
     PUT /api/admin/listings/{id}/approve   (json: {})
     PUT /api/admin/listings/{id}/reject    (json: {rejectionReason})
     PUT /api/admin/listings/{id}/hot-deal
   Status values match the backend's ListingStatus enum (xStoreECommerce.Core.Enums) —
   confirmed against source: Pending/Active/Rejected (there is no "Approved" member;
   an approved listing moves to Active). Query-string enum binding is case-insensitive.
   ============================================================ */
const MOD_STATUS_TABS=[['Pending','PENDING'],['Approved','ACTIVE'],['Rejected','REJECTED']];
const modState={status:'PENDING',page:1,pageSize:20,total:0,totalPages:1,items:null};
function gotoModerationPage(p){if(p<1||p>modState.totalPages||p===modState.page)return;modState.page=p;loadModeration();}
async function loadModeration(){
 const host=document.getElementById('modHost'); if(!host)return;
 host.innerHTML=stateLoading('Loading listings…');
 try{
   const data=await apiFetch('/api/admin/listings',{query:{status:modState.status,page:modState.page,pageSize:modState.pageSize}});
   const p=readPage(data,modState.pageSize);
   modState.items=p.items; modState.total=p.total; modState.totalPages=p.totalPages;
   renderModeration();
 }catch(e){ if(e.status===401)return; host.innerHTML=stateError(e.message,'loadModeration()'); }
}
function mapListing(p){
 let img=_fne(p.imageUrl,p.thumbnailUrl,Array.isArray(p.images)?p.images[0]:null,Array.isArray(p.imageUrls)?p.imageUrls[0]:null);
 if(img&&!/^https?:\/\//i.test(String(img))) img=API.base.replace(/\/+$/,'')+'/'+String(img).replace(/^\/+/,'');
 return{
   id:_fne(p.id,p.listingId,p._id),
   title:_fne(p.titleEn,p.title,p.titleAr)||'Untitled',
   vendor:_fne(p.vendorName,p.storeNameEn,p.vendor)||'—',
   category:_fne(p.categoryName,p.category)||'—',
   price:_numOr(p.price),
   compareAt:_numOr(p.compareAtPrice,p.compareAt)||null,
   stock:_numOr(p.stockQuantity,p.stock),
   condition:_fne(p.condition)||'—',
   brand:_fne(p.brand)||'—',
   location:_fne(p.location)||'—',
   description:_fne(p.descriptionEn,p.description)||'',
   submitted:_fne(p.createdAt,p.submittedAt)||'',
   isHot:!!(p.isHotDeal||p.hotDeal),
   image:img
 };
}
function renderModeration(){
 const host=document.getElementById('modHost'); if(!host)return;
 const items=modState.items||[];
 if(modState.status==='PENDING'){
   const b=document.querySelector('#nav a[data-view=moderation] .badge');
   if(b){ if(modState.total>0) b.textContent=modState.total; else b.remove(); }
 }
 if(!items.length){host.innerHTML=stateEmpty('No '+MOD_STATUS_TABS.find(t=>t[1]===modState.status)[0].toLowerCase()+' listings.');return;}
 const rows=items.map((p,i)=>{const m=mapListing(p);
   return `<div class="mod" data-status="${modState.status.toLowerCase()}"><div class="thumb" style="cursor:pointer" onclick="productDrawer(${i})">${m.image?'<img src="'+esc(m.image)+'" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">':'📦'}</div>
   <div class="minfo" style="cursor:pointer" onclick="productDrawer(${i})"><b>${esc(m.title)}</b>
     <p>${esc(m.vendor)} · <span class="badge-s b-grey">${esc(m.category)}</span> · <span class="money">${m.price==null?'—':EGP(m.price)}</span> · stock ${m.stock==null?'—':m.stock}${m.isHot?' · <span class="badge-s b-red">🔥 Hot</span>':''}</p>
     <p class="muted" style="font-size:12px;margin-top:3px">${m.submitted?esc(m.submitted)+' · ':''}${esc(m.condition)}</p></div>
   <div class="mactions">
     <button class="btn btn-g btn-sm" onclick="productDrawer(${i})">Details</button>
     <button class="btn btn-g btn-sm" onclick="toggleHotDeal(${i})">🔥</button>
     ${modState.status==='PENDING'?`<button class="btn btn-ok btn-sm" onclick="decide(${i},'approve')">✓ Approve</button><button class="btn btn-no btn-sm" onclick="decide(${i},'reject')">✕ Reject</button>`:''}
   </div></div>`;
 }).join('');
 host.innerHTML='<div class="grid" style="gap:14px">'+rows+'</div>'+pager('moderation');
}

/* ============================================================
   LIVE API INTEGRATION — "Users" folder of the Admin Dashboard
   Postman collection: xStoreEcommerce Admin Dashboard
     GET  /api/users?keyword&role&isVerified&vendorStatus&page&pageSize
     PUT  /api/users/{id}/approve   (vendor approval)
     PUT  /api/users/{id}/reject    (vendor rejection)
   Auth: the per-user JWT from POST /api/auth/login is sent as a
   standard `Authorization: Bearer <jwt>` header. Protected endpoints
   (e.g. GET /api/users) reply `WWW-Authenticate: Bearer` — there is no
   "Basic license" header on this backend; sending one makes every
   authenticated call 401. Anonymous endpoints (GET /api/categories) work
   without it, which is why those tabs load while Users did not.
   Paginated envelope: {items, totalCount, page, pageSize, totalPages}.
   ============================================================ */
const API_DEFAULT_BASE='https://xstoreegy-001-site1.jtempurl.com';   // hosted backend (HTTPS avoids mixed-content when the dashboard is served over https); override via the login screen's "change API server"
const API={
 get base(){return localStorage.getItem('xs_admin_base')||API_DEFAULT_BASE;},
 set base(v){v?localStorage.setItem('xs_admin_base',v):localStorage.removeItem('xs_admin_base');},
 get token(){return localStorage.getItem('xs_admin_token')||'';},
 set token(v){v?localStorage.setItem('xs_admin_token',v):localStorage.removeItem('xs_admin_token');}
};
class ApiError extends Error{constructor(status,msg){super(msg);this.status=status;}}

async function apiFetch(path,{method='GET',query,body,noAuthRedirect=false}={}){
 let url;
 try{url=new URL(API.base.replace(/\/+$/,'')+path);}catch(_){throw new ApiError(0,'Invalid API base URL.');}
 if(query)Object.entries(query).forEach(([k,v])=>{if(v!==undefined&&v!==null&&v!=='')url.searchParams.set(k,v);});
 const headers={};
 if(API.token)headers['Authorization']='Bearer '+API.token;   // protected endpoints require the JWT as a Bearer token
 let payload;
 if(body instanceof FormData){payload=body;}                              // let the browser set multipart Content-Type + boundary
 else if(body!==undefined){headers['Content-Type']='application/json';payload=JSON.stringify(body);}
 let res;
 try{res=await fetch(url.toString(),{method,headers,body:payload});}
 catch(_){throw new ApiError(0,'Network error — is the API reachable at '+API.base+'? (CORS or server down)');}
 const text=await res.text();
 let data=null; if(text){try{data=JSON.parse(text);}catch(_){data=text;}}
 if(res.status===401&&!noAuthRedirect){API.token='';renderLogin('Your session expired — please sign in again.');throw new ApiError(401,'Unauthorized');}
 if(!res.ok)throw new ApiError(res.status,serverMsg(data)||('Request failed ('+res.status+').'));
 return data;
}
function serverMsg(d){
 if(!d)return'';
 if(typeof d==='string')return d;
 return (d.error&&d.error.message)||(typeof d.error==='string'?d.error:'')||d.message||d.title||'';
}

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const _fne=(...a)=>{for(const x of a){if(x!==undefined&&x!==null&&String(x).trim()!=='')return x;}return'';};
const _numOr=(...a)=>{for(const x of a){const n=Number(x);if(x!==undefined&&x!==null&&x!==''&&Number.isFinite(n))return n;}return null;};
const _num=v=>{const n=Number(v);return Number.isFinite(n)?n:null;};
function stateLoading(msg){return '<div class="state"><span class="spin"></span><b>'+esc(msg||'Loading…')+'</b></div>';}

function readPage(data,pageSize){
 // Confirmed xStore envelope {items,totalCount,page,pageSize,totalPages}; tolerant to aliases / bare array.
 let items=[],total=0,totalPages=1;
 if(Array.isArray(data)){items=data;total=data.length;}
 else if(data&&typeof data==='object'){
   items=data.items||data.results||data.data||data.users||[];
   if(!Array.isArray(items))items=[];
   total=_num(data.totalCount)??_num(data.total)??items.length;
   totalPages=_num(data.totalPages)??Math.max(1,Math.ceil(total/(pageSize||20)));
 }
 return{items,total,totalPages};
}

function mapVendor(v){
 let stt; const sv=v.vendorStatus;
 if(sv==null||sv===''){stt=['b-grey','—'];}
 else if(typeof sv==='number'||/^\d+$/.test(String(sv))){stt=VSTATUS[Number(sv)]||['b-grey','Status '+sv];}
 else{const k=String(sv).toLowerCase(); stt=k.includes('pend')?VSTATUS[0]:(k.includes('active')||k.includes('approv'))?VSTATUS[1]:k.includes('reject')?VSTATUS[2]:k.includes('suspend')?VSTATUS[3]:['b-grey',String(sv)];}
 return{
   id:_fne(v.id,v.userId,v._id),
   store:_fne(v.storeNameEn,v.storeName,v.storeNameAr,v.fullNameEn,v.fullName,v.name)||'Unnamed store',
   owner:_fne(v.fullNameEn,v.fullName,v.ownerName,v.nameEn)||'—',
   city:_fne(v.storeCity,v.city,v.governorate,v.town)||'—',
   phone:_fne(v.phoneNumber,v.whatsAppNumber,v.phone)||'—',
   email:_fne(v.email),
   category:_fne(v.storeCategory,v.storeCategoryName,v.category)||'—',
   verified:!!v.isVerified, products:_numOr(v.productsCount,v.listingsCount,v.products), rating:_numOr(v.rating),
   joined:_fne(v.joinedAt,v.createdAt)||'—', st:stt, isPending:stt[1]==='Pending'
 };
}
function renderVendors(){

 const items=vendorsState.items||[];
 if(!items.length){host.innerHTML=stateEmpty(vendorsState.keyword?'No vendors match “'+esc(vendorsState.keyword)+'”.':'No vendors with status “'+esc(vendorsState.statusLabel)+'”.');return;}
 const rows=items.map((v,i)=>{const m=mapVendor(v);
   const act=m.isPending?'<button class="btn btn-ok btn-sm" onclick="approveVendor('+i+')">Approve</button><button class="btn btn-no btn-sm" onclick="rejectVendor('+i+')">Reject</button>':'';

     +'<td><span class="badge-s b-indigo">🏢 Business</span></td>'
     +'<td><span class="badge-s '+m.st[0]+'"><span class="dotb" style="background:currentColor"></span>'+esc(m.st[1])+'</span>'+(m.verified?' <span class="badge-s b-green">✓</span>':'')+'</td>'
     +'<td>'+(m.products==null?'—':m.products)+'</td><td>'+(m.rating==null?'—':'⭐ '+m.rating)+'</td>'
     +'<td class="r"><button class="btn btn-g btn-sm" onclick="remoteVendorDrawer('+i+')">Details</button>'+act+'</td></tr>';
 }).join('');
 host.innerHTML='<table><thead><tr><th>Vendor</th><th>Account type</th><th>Status</th><th>Products</th><th>Rating</th><th class="r">Action</th></tr></thead><tbody>'+rows+'</tbody></table>'+pager('vendors');
}

function approveVendor(i){vendorDecision(i,'approve');}
function rejectVendor(i){vendorDecision(i,'reject');}
async function vendorDecision(i,action){
 const v=(vendorsState.items||[])[i]; if(!v)return; const m=mapVendor(v);
 if(!m.id){toast('Missing vendor id — cannot '+action);return;}
 if(action==='reject'&&!confirm('Reject vendor “'+m.store+'”? They will be notified.'))return;
 try{
   await apiFetch('/api/users/'+encodeURIComponent(m.id)+'/'+action,{method:'PUT'});
   toast(action==='approve'?'Vendor approved — now selling ✓':'Vendor rejected — notified');
   closeDrawer(); loadVendors();
 }catch(e){ if(e.status===401)return; toast((action==='approve'?'Approve':'Reject')+' failed: '+(e.message||'error')); }
}

/* ============================================================
   Orders (live) — "xStoreEcommerce Admin & Super Admin" Postman collection,
   Administrator role, "Orders" folder:
     GET  /api/admin/orders?page&pageSize&status
     GET  /api/admin/orders/{id}
     POST /api/admin/orders/{id}/cancel   (json: {reason})
   status is numeric: 0=Pending,1=Confirmed,2=Processing,3=Shipped,4=Delivered,5=Cancelled.
   The collection ships no example response body, so mapOrder() reads every field
   defensively via _fne/_numOr, same as mapListing/mapVendor.
   ============================================================ */
const ORDER_STATUS_TABS=[['All',''],['Pending','0'],['Confirmed','1'],['Processing','2'],['Shipped','3'],['Delivered','4'],['Cancelled','5']];
const OSTATN={0:['b-grey','Pending'],1:['b-blue','Confirmed'],2:['b-indigo','Processing'],3:['b-amber','Shipped'],4:['b-green','Delivered'],5:['b-red','Cancelled']};
const ordersState={status:'',page:1,pageSize:20,total:0,totalPages:1,items:null};
function gotoOrdersPage(p){if(p<1||p>ordersState.totalPages||p===ordersState.page)return;ordersState.page=p;loadOrders();}
async function loadOrders(){
 const host=document.getElementById('ordersHost'); if(!host)return;
 host.innerHTML=stateLoading('Loading orders…');
 try{
   const data=await apiFetch('/api/admin/orders',{query:{status:ordersState.status,page:ordersState.page,pageSize:ordersState.pageSize}});
   const p=readPage(data,ordersState.pageSize);
   ordersState.items=p.items; ordersState.total=p.total; ordersState.totalPages=p.totalPages;
   renderOrders();
 }catch(e){ if(e.status===401)return; host.innerHTML=stateError(e.message,'loadOrders()'); }
}
function orderStatusBadge(raw){
 if(raw==null||raw==='')return['b-grey','—'];
 if(typeof raw==='number'||/^\d+$/.test(String(raw)))return OSTATN[Number(raw)]||['b-grey','Status '+raw];
 const k=String(raw).toLowerCase();
 return k.includes('pend')?OSTATN[0]:k.includes('confirm')?OSTATN[1]:k.includes('process')?OSTATN[2]:k.includes('ship')?OSTATN[3]:k.includes('deliver')?OSTATN[4]:k.includes('cancel')?OSTATN[5]:['b-grey',String(raw)];
}
function mapOrder(o){
 const items=Array.isArray(o.items)?o.items:Array.isArray(o.orderItems)?o.orderItems:[];
 const mappedItems=items.map(it=>({name:_fne(it.titleEn,it.title,it.productName,it.name)||'Item',qty:_numOr(it.quantity,it.qty)||1,price:_numOr(it.price,it.unitPrice)||0}));
 return{
   id:_fne(o.id,o.orderId,o._id),
   code:_fne(o.orderNumber,o.code,o.id,o.orderId)||'—',
   buyer:_fne(o.buyerName,o.customerName,o.consumerName,o.userName)||'—',
   phone:_fne(o.phoneNumber,o.buyerPhone,o.customerPhone,o.phone)||'—',
   addr:_fne(o.address,o.deliveryAddress,o.shippingAddress)||'—',
   vendor:_fne(o.vendorName,o.storeNameEn,o.storeName)||'—',
   total:_numOr(o.total,o.totalAmount,o.totalPrice,o.grandTotal),
   items:mappedItems,
   statusRaw:o.status,
   status:_numOr(o.status),
   st:orderStatusBadge(o.status)
 };
}
function renderOrders(){
 const host=document.getElementById('ordersHost'); if(!host)return;
 const items=ordersState.items||[];
 if(!items.length){host.innerHTML='<div class="card"><div class="c-body">'+stateEmpty('No orders found.')+'</div></div>';return;}
 const rows=items.map((o,i)=>{const m=mapOrder(o);
   return `<tr data-status="${esc((m.st[1]||'').toLowerCase())}"><td><b style="cursor:pointer" onclick="orderDrawer(${i})">${esc(m.code)}</b></td>
     <td><div class="u" style="cursor:pointer" onclick="orderDrawer(${i})">${avatar(m.buyer)}<b>${esc(m.buyer)}</b></div></td>
     <td class="muted">${esc(m.vendor)}</td>
     <td class="money">${m.total==null?'—':EGP(m.total)}</td>
     <td><span class="badge-s b-grey">COD</span></td>
     <td><span class="badge-s ${m.st[0]}">${esc(m.st[1])}</span></td>
     <td class="r"><button class="btn btn-g btn-sm" onclick="orderDrawer(${i})">View</button></td></tr>`;
 }).join('');
 host.innerHTML='<div class="card"><table><thead><tr><th>Order</th><th>Buyer</th><th>Vendor</th><th>Total</th><th>Payment</th><th>Status</th><th class="r"></th></tr></thead><tbody>'+rows+'</tbody></table></div>'+pager('orders');
}
async function orderDrawer(i){
 const row=(ordersState.items||[])[i]; if(!row)return;
 let m=mapOrder(row);

async function cancelOrder(i){

 if(!m.id){toast('Missing order id');return;}
 const reason=prompt('Reason for cancelling order '+m.code+'? (shown to the buyer/vendor)','');
 if(reason===null)return;
 try{
   await apiFetch('/api/admin/orders/'+encodeURIComponent(m.id)+'/cancel',{method:'POST',body:{reason}});
   toast('Order cancelled ✓');
   closeDrawer(); loadOrders();
 }catch(e){ if(e.status===401)return; toast('Cancel failed: '+(e.message||'error')); }
}

/* ============================================================
   Vendor commission wallet (live) — per-vendor, reached from remoteVendorDrawer():
     GET   /api/admin/vendors/{id}/commission       → {outstandingEgp,warnThresholdEgp,pauseThresholdEgp}
     PATCH /api/admin/vendors/{id}/commission        (json: {warnThresholdEgp,pauseThresholdEgp})
     POST  /api/admin/vendors/{id}/commission/settle (json: {amountEgp} — omit body to mark fully paid)
   Field names are unconfirmed (no example response in the collection), read defensively.
   ============================================================ */
function mapCommission(c){
 return{
   outstanding:_numOr(c.outstandingEgp,c.outstanding,c.balance,c.balanceEgp)||0,
   warn:_numOr(c.warnThresholdEgp,c.warnThreshold,c.warn)||0,
   pause:_numOr(c.pauseThresholdEgp,c.pauseThreshold,c.pause)||0
 };
}
const commLevelLive=c=>c.outstanding>=c.pause?'paused':c.outstanding>=c.warn?'warn':'none';
async function vendorCommissionDrawer(i){
 const v=(vendorsState.items||[])[i]; if(!v)return; const m=mapVendor(v);
 if(!m.id){toast('Missing vendor id');return;}
 openDrawer('Commission — '+esc(m.store), stateLoading('Loading wallet…'));
 try{
   const data=await apiFetch('/api/admin/vendors/'+encodeURIComponent(m.id)+'/commission');
   renderVendorCommissionDrawer(i,m,mapCommission(data));
 }catch(e){ if(e.status===401)return; openDrawer('Commission — '+esc(m.store), stateError(e.message,'vendorCommissionDrawer('+i+')')); }
}

 const badge={none:['b-green','Healthy'],warn:['b-amber','Warn — near limit'],paused:['b-red','Paused — publishing blocked']}[lvl];

   :`<div style="display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;margin-bottom:16px;background:${lvl==='paused'?'var(--error-bg)':'var(--warning-bg)'};color:${lvl==='paused'?'#8A3A24':'#7E5A14'}">

         ?`This vendor owes <b>${EGP(c.outstanding)}</b> (≥ pause threshold ${EGP(c.pause)}). New listing publishes are held until the balance is paid down.`
         :`This vendor owes <b>${EGP(c.outstanding)}</b> (≥ warn threshold ${EGP(c.warn)}). Notify them to pay before publishing is paused at ${EGP(c.pause)}.`}</p></div></div>`;
 const owedColor=lvl==='paused'?'#B4472E':lvl==='warn'?'#C68A2E':'#2C6347';
 const pay=c.outstanding>0
   ?'<div class="form-row"><label>Amount received from vendor (EGP)</label><input id="vcPayAmt" inputmode="numeric" value="'+c.outstanding+'"></div>'

     +'<button class="btn btn-g" style="flex:1;justify-content:center" onclick="settleVendorCommission('+i+',true)">Mark fully paid</button></div>'
   :'<div style="padding:12px 14px;background:var(--success-bg);color:#2C6347;border-radius:11px;font-size:13px;font-weight:600;margin-bottom:16px">✓ Wallet settled — nothing to collect.</div>';
 openDrawer('Commission — '+esc(m.store),
   '<div style="font-size:12.5px;color:var(--text-2);margin-bottom:6px">Outstanding balance</div>'
   +'<div style="font-size:30px;font-weight:800;color:'+owedColor+';margin-bottom:12px;font-variant-numeric:tabular-nums">'+EGP(c.outstanding)+'</div>'
   +'<span class="badge-s '+badge[0]+'">'+badge[1]+'</span>'
   +'<div style="margin-top:16px">'+banner+'</div>'
   +secH('Collect payment')+pay
   +secH('Thresholds (EGP)')
   +'<div class="form-row"><label>Warn threshold — notify vendor to pay</label><input id="vcWarnTh" inputmode="numeric" value="'+c.warn+'"></div>'
   +'<div class="form-row"><label>Pause threshold — block new publishes</label><input id="vcPauseTh" inputmode="numeric" value="'+c.pause+'"></div>'
   +'<p class="muted" style="font-size:12px;margin:-4px 0 4px">Pause must be ≥ warn.</p>',
   '<button class="btn btn-p" style="flex:1;justify-content:center" onclick="saveVendorCommissionThresholds('+i+')">Save thresholds</button><button class="btn btn-g" style="flex:1;justify-content:center" onclick="closeDrawer()">Close</button>');
}
async function saveVendorCommissionThresholds(i){
 const v=(vendorsState.items||[])[i]; if(!v)return; const m=mapVendor(v);
 if(!m.id){toast('Missing vendor id');return;}
 const warn=parseFloat(document.getElementById('vcWarnTh').value);
 const pause=parseFloat(document.getElementById('vcPauseTh').value);
 if(isNaN(warn)||warn<0){toast('Enter a valid warn threshold');document.getElementById('vcWarnTh').focus();return;}
 if(isNaN(pause)||pause<0){toast('Enter a valid pause threshold');document.getElementById('vcPauseTh').focus();return;}
 if(pause<warn){toast('Pause threshold must be ≥ warn threshold');document.getElementById('vcPauseTh').focus();return;}
 try{
   await apiFetch('/api/admin/vendors/'+encodeURIComponent(m.id)+'/commission',{method:'PATCH',body:{warnThresholdEgp:warn,pauseThresholdEgp:pause}});
   toast('Commission thresholds saved ✓');
   vendorCommissionDrawer(i);
 }catch(e){ if(e.status===401)return; toast('Save failed: '+(e.message||'error')); }
}
async function settleVendorCommission(i,full){
 const v=(vendorsState.items||[])[i]; if(!v)return; const m=mapVendor(v);
 if(!m.id){toast('Missing vendor id');return;}
 let amountEgp;
 if(!full){
   amountEgp=parseFloat(document.getElementById('vcPayAmt').value);
   if(isNaN(amountEgp)||amountEgp<=0){toast('Enter a valid amount');document.getElementById('vcPayAmt').focus();return;}
 }
 try{
   await apiFetch('/api/admin/vendors/'+encodeURIComponent(m.id)+'/commission/settle',{method:'POST',body:full?{}:{amountEgp}});
   toast(full?'Payment recorded — wallet settled ✓':'Payment recorded ✓');
   vendorCommissionDrawer(i);
 }catch(e){ if(e.status===401)return; toast('Payment failed: '+(e.message||'error')); }
}

async function saveSystemSettings(){
 const commission=parseFloat(document.getElementById('sysCommission').value);
 const warn=parseFloat(document.getElementById('sysWarnTh').value);
 const pause=parseFloat(document.getElementById('sysPauseTh').value);
 if(isNaN(commission)||commission<0){toast('Enter a valid commission value');document.getElementById('sysCommission').focus();return;}
 if(isNaN(warn)||warn<0){toast('Enter a valid warn threshold');document.getElementById('sysWarnTh').focus();return;}
 if(isNaN(pause)||pause<0){toast('Enter a valid pause threshold');document.getElementById('sysPauseTh').focus();return;}
 if(pause<warn){toast('Pause threshold must be ≥ warn threshold');document.getElementById('sysPauseTh').focus();return;}
 const btn=document.getElementById('sysSaveBtn'); if(btn){btn.disabled=true;btn.textContent='Saving…';}
 try{
   await apiFetch('/api/admin/system-settings',{method:'PUT',body:{commissionValueOnOrder:commission,warnThresholdEgp:warn,pauseThresholdEgp:pause}});
   toast('System settings saved ✓');
   sysSettingsState.loaded={commission,warn,pause};
   renderSystemSettings();
 }catch(e){ if(e.status===401)return; toast('Save failed: '+(e.message||'error')); if(btn){btn.disabled=false;btn.textContent='Save changes';} }
}

/* ============================================================
   DELIVERY API — the standalone delivery-backend (Bearer JWT).
   Couriers, package requests and cash oversight are served by
   github.com/AhmedElemey/delivery-backend, a SEPARATE service
   from the marketplace API above (its own base URL + token).
   Not connected → the two delivery views show the demo seed
   data below; connected → they manage live records.
   ============================================================ */
const DELIVERY_DEFAULT_BASE='http://localhost:5080';
const DEMO_COURIERS=COURIERS.slice();
const DEMO_PKGS=PKGS.slice();
const DELIVERY={
 get base(){return localStorage.getItem('xs_delivery_base')||DELIVERY_DEFAULT_BASE;},
 set base(v){v?localStorage.setItem('xs_delivery_base',v):localStorage.removeItem('xs_delivery_base');},
 get token(){return localStorage.getItem('xs_delivery_token')||'';},
 set token(v){v?localStorage.setItem('xs_delivery_token',v):localStorage.removeItem('xs_delivery_token');},
 get connected(){return !!localStorage.getItem('xs_delivery_token');}
};
async function deliveryFetch(path,{method='GET',body}={}){
 const url=DELIVERY.base.replace(/\/+$/,'')+path;
 const headers={}; if(DELIVERY.token)headers['Authorization']='Bearer '+DELIVERY.token;
 let payload; if(body!==undefined){headers['Content-Type']='application/json';payload=JSON.stringify(body);}
 let res;
 try{res=await fetch(url,{method,headers,body:payload});}
 catch(_){throw new Error('Cannot reach delivery API at '+DELIVERY.base+' (server down or CORS).');}
 const text=await res.text(); let data=null; if(text){try{data=JSON.parse(text);}catch(_){data=text;}}
 if(res.status===401){DELIVERY.token='';throw new Error('Delivery session expired — reconnect.');}
 if(!res.ok)throw new Error((data&&(data.title||data.message||(typeof data.error==='string'?data.error:'')))||('Request failed ('+res.status+').'));
 return data;
}
function currentView(){const a=document.querySelector('#nav a.active');return a?a.dataset.view:'';}
function rerenderDelivery(){const v=currentView();if(v==='couriers'||v==='packages')document.getElementById('content').innerHTML=VIEWS[v]();}

/* connect bar rendered at the top of both delivery views */
function deliveryConnectBar(){
 if(DELIVERY.connected)
   return '<div class="card" style="padding:11px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;margin-top:14px">'
     +'<span class="badge-s b-green">● Live</span><span class="muted">Connected to delivery API · <code>'+esc(DELIVERY.base)+'</code></span>'
     +'<button class="btn btn-g btn-sm" style="margin-left:auto" onclick="deliveryDisconnect()">Disconnect</button></div>';
 return '<div class="card" style="padding:14px;margin-top:14px">'
   +'<div style="font-size:12.5px;color:var(--text-2);margin-bottom:9px"><b style="color:var(--text)">Showing demo data.</b> Connect the delivery API (<code>delivery-backend</code>) to manage live requests, couriers and cash.</div>'
   +'<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">'
   +'<div class="form-row" style="margin:0;flex:2;min-width:200px"><label>Delivery API base URL</label><input id="dlvBase" value="'+esc(DELIVERY.base)+'"></div>'
   +'<div class="form-row" style="margin:0;flex:1;min-width:150px"><label>Admin phone</label><input id="dlvPhone" placeholder="+201000000003"></div>'
   +'<button class="btn btn-p" onclick="deliveryConnect()">Connect</button></div></div>';
}
async function deliveryConnect(){
 const base=document.getElementById('dlvBase').value.trim();
 const phone=document.getElementById('dlvPhone').value.trim();
 if(base)DELIVERY.base=base;
 if(!phone){toast('Enter the admin phone');return;}
 try{
   const data=await deliveryFetch('/api/auth/login',{method:'POST',body:{phoneNumber:phone}});
   if(!data||!data.token)throw new Error('No token returned.');
   if(data.role&&String(data.role).toLowerCase()!=='admin'){throw new Error('That account is not an admin.');}
   DELIVERY.token=data.token; toast('Delivery API connected ✓'); go(currentView()||'couriers');
 }catch(e){toast(e.message||'Connect failed');}
}
function deliveryDisconnect(){DELIVERY.token='';COURIERS=DEMO_COURIERS.slice();PKGS=DEMO_PKGS.slice();toast('Disconnected — showing demo data');go(currentView()||'couriers');}

/* ---- DTO → view-model mappers ---- */
function _dlvAgo(iso){
 if(!iso)return'—'; const t=new Date(iso).getTime(); if(isNaN(t))return'—';
 const s=Math.floor((Date.now()-t)/1000); if(s<60)return'just now';
 const m=Math.floor(s/60); if(m<60)return m+' min ago';
 const h=Math.floor(m/60); if(h<24)return h+'h ago';
 const d=Math.floor(h/24); return d===1?'Yesterday':d+'d ago';
}
function _dlvMonthYear(iso){const dt=new Date(iso); return isNaN(dt)?'—':dt.toLocaleDateString('en-US',{month:'short',year:'numeric'});}
const _DLV_PSTAT={submitted:'submitted',priced:'priced',confirmed:'confirmed',pickedUp:'pickedup',delivered:'delivered',cancelled:'cancelled'};
function mapCourierSummary(c){return {apiId:c.id,n:c.name||'—',phone:c.phone||'—',zone:c.zone||'—',status:c.status==='off'?'off':'active',cash:+c.cashInHandEgp||0,cap:+c.handoverThresholdEgp||5000,today:+c.today||0,delivered30:+c.delivered30||0,failed30:+c.failed30||0,joined:_dlvMonthYear(c.joined)};}
function courierNameById(id){const c=COURIERS.find(x=>x.apiId===id);return c?c.n:null;}
function mapRequest(r){
 const pk=r.pickup||{},dp=r.dropoff||{};
 return {apiId:r.id,id:(r.id&&r.id.length>10)?r.id.slice(0,8):(r.id||'—'),
  customer:r.consumerName||'—',phone:r.consumerPhone||'—',
  pickup:{street:pk.street||'',city:pk.city||''},
  drop:{name:dp.fullName||'',phone:dp.phone||'',street:dp.street||'',city:dp.city||''},
  note:r.packageNote||'',submitted:_dlvAgo(r.createdAt),status:_DLV_PSTAT[r.status]||'submitted',
  requesterRole:(r.requesterRole==='vendor')?'vendor':'customer',
  price:r.price!=null?+r.price:null,courier:r.courierId?(courierNameById(r.courierId)||'Courier'):null,courierId:r.courierId||null};
}

/* ---- live loaders (registered in AFTER) ---- */
async function loadCouriers(){
 if(!DELIVERY.connected)return;
 try{const data=await deliveryFetch('/api/admin/couriers');
   COURIERS=(Array.isArray(data)?data:[]).map(mapCourierSummary);
   rerenderDelivery(); refreshCourierBadge();
 }catch(e){toast(e.message);}
}
async function loadPackages(){
 if(!DELIVERY.connected)return;
 try{
   if(!COURIERS.length||!COURIERS[0].apiId){try{const cs=await deliveryFetch('/api/admin/couriers');COURIERS=cs.map(mapCourierSummary);}catch(_){}}
   const data=await deliveryFetch('/api/delivery-requests/admin');
   PKGS=(Array.isArray(data)?data:[]).map(mapRequest);
   rerenderDelivery(); refreshPkgBadge();
 }catch(e){toast(e.message);}
}

/* ---- live mutation wrappers (called from the shared handlers) ---- */
async function dlvSetPrice(i,amt){
 const p=PKGS[i]; PKG_EDIT=-1; const price=Math.round(amt*100)/100;
 try{await deliveryFetch('/api/delivery-requests/'+p.apiId+'/price',{method:'POST',body:{price}});
   toast('Priced at '+EGP(price)+' — customer asked to confirm ✓'); await loadPackages();
 }catch(e){toast(e.message);}
}
async function dlvAssignPkgCourier(i,ci){
 const p=PKGS[i],c=COURIERS[ci];
 try{await deliveryFetch('/api/delivery-requests/'+p.apiId+'/assign',{method:'POST',body:{courierId:c.apiId}});
   toast(p.id+' assigned to '+c.n+' ✓'); closeDrawer(); await loadPackages();
 }catch(e){toast(e.message);}
}
async function dlvRecordHandover(i){
 const c=COURIERS[i];
 try{await deliveryFetch('/api/admin/couriers/'+c.apiId+'/cash-handover',{method:'POST'});
   toast('Handover recorded — courier settled ✓'); closeDrawer(); await loadCouriers();
 }catch(e){toast(e.message);}
}
async function dlvCourierDuty(i){
 const c=COURIERS[i],next=c.status==='active'?'off':'active';
 try{await deliveryFetch('/api/admin/couriers/'+c.apiId+'/duty',{method:'POST',body:{status:next}});
   toast(c.n+(next==='active'?' is on duty ✓':' set off duty')); closeDrawer(); await loadCouriers();
 }catch(e){toast(e.message);}
}
async function dlvCreateCourier(name,phone,zone){
 try{await deliveryFetch('/api/admin/couriers',{method:'POST',body:{name,phone,zone}});
   toast('Courier "'+name+'" created ✓ — share the login with them'); closeDrawer(); await loadCouriers();
 }catch(e){toast(e.message);}
}

/* boot — gate the console behind sign-in (live API needs the JWT) */
if(API.token){ go('overview'); loadAdminProfile(); } else { renderLogin(); }
</script>
